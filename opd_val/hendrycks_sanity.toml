# Hendrycks Sanity Check — the standard "does RL work at all" experiment.
#
# From "Defeating the Training-Inference Mismatch" (arXiv:2510.26788), shipped as
# examples/basic/hendrycks-sanity/rl.toml. The dataset is filtered from MATH to
# problems the base model solves 20-80% of the time over 40 rollouts, so a
# working RL algorithm should drive TRAINING reward steadily upward (the paper's
# bar is >95% on this perfectible subset).
#
# This is the control for everything in opd_val/: it uses a different model, a
# different task, a different taskset and the vetted upstream hyperparameters.
# If reward climbs here, prime-rl trains correctly on this cluster and the flat
# reverse-text results are about that task//model pair. If it stays flat, the
# problem is prime-rl-on-ROCm and no distillation result here is interpretable.
#
# Deltas from the upstream example, all noted so they can be undone:
#   max_steps 5000 -> 200      first look; the paper's curve moves well before this
#   eval removed               aime24 @ group_size 32 every 50 steps is pure cost
#                              here — the sanity metric is TRAINING reward
#   trainer.model.compile off  required on ROCm (inductor's flash-attn varlen
#                              meta kernel reports a transposed shape)
# Everything else — model, batch_size, group_size, seq_len, renderer, 4+4 GPU
# split — is upstream's.

max_steps = 200

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 512
group_size = 8
seq_len = 8192

[[orchestrator.train.env]]
name = "hendrycks-math"
taskset = { id = "math-env-v1", dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B", dataset_subset = "default" }
harness = { id = "null", runtime = { type = "subprocess" } }

[trainer.model]
seq_len = 16384
compile = "None"

[inference.model]
max_model_len = 8192

# Model not in MODEL_RENDERER_MAP — opt into DefaultRenderer (apply_chat_template).
[orchestrator.renderer]
name = "default"
reasoning_parser = "think"
