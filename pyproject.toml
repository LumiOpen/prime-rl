[project]
name = "prime-rl"
version = "0.10.0"
description = "Async RL Training at Scale"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "prime-rl-configs",
    "prime-pydantic-config>=0.4.3",
    "beartype>=0.21.0",
    "datasets>=4.0.0",
    "jaxtyping>=0.3.2",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "transformers==5.19.0",
    "wandb>=0.26.1",
    "wandb-workspaces>=0.4.3",
    "prime>=0.8.0",
    "prime-runs[train]>=0.1.4",
    "pyzmq>=27.1.0",
    "aiolimiter>=1.2.1",
    "tenacity>=8.2.0",
    "openai>=1.106.1",
    "orjson>=3.11.0",
    "psutil>=7.0.0",
    "prometheus-client>=0.20.0",
    "pyzstd>=0.16.2",
    "rich>=14.0.0",
    "setproctitle>=1.3.0",
    "uvloop>=0.21.0",
    "verifiers[harbor]>=0.4.0",
    "renderers[multimodal]>=0.1.12",
    "pybase64>=1.4.2",
    "msgspec>=0.18",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
rl = "prime_rl.entrypoints.rl:main"
sft = "prime_rl.entrypoints.sft:main"
inference = "prime_rl.entrypoints.inference:main"
trainer = "prime_rl.entrypoints.trainer:main"
orchestrator = "prime_rl.entrypoints.orchestrator:main"
eval = "prime_rl.entrypoints.eval:main"
env-server = "prime_rl.entrypoints.env_server:main"
dashboard = "prime_rl.entrypoints.dashboard:main"

[project.entry-points."vllm.general_plugins"]
prime_rl = "prime_rl.inference.patches:apply_shared_vllm_patches"

[project.optional-dependencies]
# Every extra here must be installable on LUMI, because `uv sync --all-extras` selects
# all of them and ignores the curated `all` below. Upstream's CUDA-only extras —
# `dynamo`, `flash-attn-3`, `flash-attn-cute`, `disagg`, `quack`, `sonic-moe`,
# `kernels` — are therefore deleted outright rather than merely left out of `all`.
#
# This is not hypothetical tidiness. flash-attention v2.8.3 ships `flash_attn/cute/`,
# so our own ROCm wheel already provides the module `attn.py` imports at module scope;
# what `flash-attn-4` added was `nvidia-cutlass-dsl`, which made `import cutlass` inside
# it *succeed* and then fail on a missing `cute.core.ThrMma`. The guard in
# trainer/models/layers/attn.py only catches ImportError, so that AttributeError killed
# the trainer at startup. Without the CUTLASS DSL the same import raises ImportError and
# is caught, which is why removing these extras is the fix.
#
# `vllm-router` was rescued out of `disagg`: it is a prebuilt abi3 Rust binary with no
# CUDA in it, and multi-node inference needs it. The rest of `disagg` (DeepEP, DeepGEMM,
# NIXL) has no ROCm build at all.

# LUMI (MI250X / gfx90a, ROCm 7.2). Upstream's `gpu` extra is CUDA-only: FlashInfer,
# FlashMLA, cuDNN-frontend, CUTLASS DSL, NIXL-cu13, deep-select and modelexpress ship
# no ROCm build, and TileLang/mamba-ssm need nvcc. None of them are imported at module
# scope outside the DeepSeek-V4 sparse-MLA kernels and the NIXL weight transport, so a
# ROCm install that omits them reaches the trainer and orchestrator intact.
gpu = [
    "torch>=2.13.0 ; sys_platform == 'linux'",
    "torchvision ; sys_platform == 'linux'",
    # torchaudio is unused by prime-rl and the rocm7.2 index stops at 2.11, which
    # would not match the torch 2.13 pin above.
    "torchdata>=0.11.0 ; sys_platform == 'linux'",
    # TEMP(vllm-wheel): held out until job 23189736 lands the ROCm wheel. Restore
    # together with the [tool.uv.sources] entry — grep TEMP(vllm-wheel).
    # "vllm>=0.32.0 ; sys_platform == 'linux'",
    "torchtitan ; sys_platform == 'linux'",
    "dion ; sys_platform == 'linux'",
    "flash-linear-attention>=0.6.0 ; sys_platform == 'linux'",
    "torchao>=0.18.0 ; sys_platform == 'linux'",
    "amdsmi ; sys_platform == 'linux'",
    # Multi-node inference fronts the vLLM replicas with this; it is a cp38-abi3 Rust
    # wheel, so it is as ROCm-safe as it is CUDA-safe.
    "vllm-router ; sys_platform == 'linux'",
    # NOT optional, whatever upstream's `kernels` extra implies: collectives.py imports
    # it at module scope, so the trainer cannot start without it. Built from the
    # submodule rather than the cu130 release wheel — see [tool.uv.sources].
    "prime-kernels ; sys_platform == 'linux'",
    # Also not optional: transports/weights/__init__.py imports the NIXL transport
    # unconditionally, and that module imports `modelexpress.client` at module scope.
    # Its own `nixl` requirement is dropped below — NIXL is the server-side transport
    # and has no ROCm build. Kept at upstream's exact pin: unpinned, uv resolves 0.7.0,
    # which is untested against this client API and drags in boto3 and the three runai
    # cloud streamers for nothing.
    "modelexpress==0.3.0 ; sys_platform == 'linux'",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# The upstream prebuilt wheels are cu130 and unusable here; the ROCm build comes from
# `build_flash_attn_wheel.sbatch` and is pinned by path in [tool.uv.sources].
flash-attn = [
    "flash-attn>=2.8.3 ; platform_machine == 'x86_64'",
]
# Kept as an alias so `--extra all` and `--all-extras` install the same thing.
all = [
    "prime-rl[gpu]",
    "prime-rl[flash-attn]",
    "prime-rl[dashboard]",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pre-commit>=4.2.0",
    "playwright>=1.49",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.12.1",
]

[tool.uv]
# Enforce a uv version that supports the friendly-duration form
# (`"7 days"`) in the static pyproject parser. Older uvs silently parse
# the value as an RFC 3339 date, emit a TOML parse warning, and proceed
# *without* the cooldown — bypassing this security policy.
required-version = ">=0.11.1"
exclude-newer = "7 days"
# prime-kernels builds through setup.py, which imports torch to decide what to compile.
# An isolated build env would resolve that `torch>=2.9.0` from PyPI — a CUDA wheel —
# because [tool.uv.sources] does not reach build requirements, and `match-runtime` is
# refused for a setup.py package ("does not declare static metadata"). Building against
# the project environment instead gets it the ROCm torch, which is what makes setup.py
# skip every CUDAExtension. Consequence: torch must already be installed when
# prime-kernels is built, which holds on every sync into an existing environment.
no-build-isolation-package = ["flash-attn", "prime-kernels"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Pin the ROCm builds of torch and triton. Transitive requirements name plain `torch`
# and `triton`, which resolve to the CUDA wheels and drag in the whole nvidia-* stack;
# the overrides force every consumer onto the rocm7.2 index instead. The torch version
# must match whatever `build_vllm_wheel.sbatch` and `build_flash_attn_wheel.sbatch`
# linked against — the vLLM and flash-attn wheels are valid for exactly one torch ABI.
override-dependencies = [
    "torch==2.13.0+rocm7.2",
    "torchvision==0.28.0+rocm7.2",
    # 3.7.1, not 3.7.0: this is what torch 2.13.0+rocm7.2 pulls in on its own, and
    # it is what both wheels above were actually built against (job 23185302).
    "triton-rocm==3.7.1",
    "openenv-core",
]

# prime-envs packages are auto-discovered as workspace members, so new
# envs there need no per-package registration. verifiers' example envs are opt-in:
# only the ones prime-rl trains or tests on are listed, so an upstream example with
# conflicting pins can't break the shared lock. Install them with
# `uv sync --all-packages`.
[tool.uv.workspace]
members = [
    "deps/prime-envs/environments/*/*",
    "deps/verifiers/environments/alphabet_sort",
    "deps/verifiers/environments/color_codeword",
    "deps/verifiers/environments/gsm8k",
    "deps/verifiers/environments/kuhn_poker",
    "deps/verifiers/environments/proposer_solver",
    "deps/verifiers/environments/reverse_text",
    "deps/verifiers/environments/wiki_search",
    "deps/verifiers/environments/wordle",
]
# Tau tasksets require litellm<1.82.7, while Harbor requires litellm>=1.92.0.
# Apex pins a verifiers git revision instead of the editable workspace member.
# ALE CLI requires numpy>=2.4.4, while vLLM 0.32.0 (via mistral-common) requires numpy<2.4.
# IFBench requires setuptools<78, while vLLM 0.32.0 requires setuptools>=78.1.1.
# A workspace shares one lock, so these packages need separate environments.
exclude = [
    "deps/prime-envs/environments/if/ifbench",
    "deps/prime-envs/environments/office/ale_cli",
    "deps/prime-envs/environments/tool_use/tau2_bench",
    "deps/prime-envs/environments/tool_use/tau2_synth",
    "deps/prime-envs/environments/tool_use/tau3_bench",
    "deps/prime-envs/environments/tool_use/apex_agents",
]

# Upstream caps this to the validated protobuf major (ModelExpress 0.3.0 publishes
# protobuf<6 metadata, but its generated proto is compatible with protobuf 6, and
# prime-sandboxes requires >=6.31.1). We additionally drop its `nixl` requirement:
# NIXL is CUDA-only, and the client half prime-rl imports does not touch it.
[[tool.uv.dependency-metadata]]
name = "modelexpress"
version = "0.3.0"
requires-dist = [
    "grpcio>=1.66.2",
    "huggingface_hub>=0.20.0",
    "numpy>=1.24.0",
    "protobuf>=5.27.0,<7.0.0",
    "pydantic>=2.0.0",
    "torch>=2.6.0",
]

# The upstream metadata overrides for ai-dynamo-runtime, nixl and
# nvidia-cutlass-dsl went with the extras that pulled them. If any of those names ever
# reappears in `uv tree`, something CUDA-only has crept back into the graph — fix that
# rather than re-adding the override.

[tool.uv.exclude-newer-package]
# verifiers pins harbor==0.24.0, published inside the rolling window;
# bounded cutoff mirroring the one in deps/verifiers/pyproject.toml
harbor = "2026-10-08T00:00:00Z"
# CA bundle: security fixes (e.g. 2026.10.19 for the eMudhra compromise) must not wait out the cooldown
certifi = false
tokenspeed-mla = false
# vLLM 0.32.0 pins flashinfer-python 0.7.0.post1, published inside the rolling window
flashinfer-python = false
# vLLM 0.32.0 pins these, published inside the rolling window
instanttensor = false
humming-kernels = false
fastokens = false
flash_attn_3 = false
# PrimeIntellect-published packages in this project's dependency closure —
# fast-track so first-party releases can land same-day. Only packages that
# appear in `uv tree` need to be listed; the resolver ignores entries for
# packages it never sees.
prime = false
prime-runs = false
prime-traces = false
prime-sandboxes = false
prime-tunnel = false
prime-evals = false
verifiers = false
renderers = false
prime-pydantic-config = false
# Trusted git/URL sources pinned by rev or wheel URL (defensive: belt-and-suspenders)
vllm-router = false
dion = false
torchao = false

[tool.uv.sources]
prime-rl-configs = { path = "packages/prime-rl-configs", editable = true }
# prime-rl consumes `verifiers.v1` (incl. the built-in harnesses/tasksets); env tasksets
# live under deps/{verifiers,prime-envs}/environments.
verifiers = { path = "deps/verifiers", editable = true }
renderers = { path = "deps/renderers", editable = true }
prime-pydantic-config = { path = "deps/pydantic-config", editable = true }
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "23e4dfc" }
amdsmi = { path = "amd_smi" }
dion = { git = "https://github.com/samsja/dion.git", rev = "0c801b0" }
vllm-router = [
    { url = "https://github.com/PrimeIntellect-ai/router/releases/download/v0.2.3/vllm_router-0.2.3-cp38-abi3-manylinux_2_28_x86_64.whl", marker = "platform_machine == 'x86_64'" },
    { url = "https://github.com/PrimeIntellect-ai/router/releases/download/v0.2.3/vllm_router-0.2.3-cp38-abi3-manylinux_2_28_aarch64.whl", marker = "platform_machine == 'aarch64'" },
]
# ROCm builds of vLLM and flash-attn. vLLM publishes no ROCm wheel and flash-attn's
# ROCm path is a HIP extension that links libtorch, so both are built on LUMI by
# build_vllm_wheel.sbatch / build_flash_attn_wheel.sbatch and pinned by path. A source
# build during `uv sync` is not an option: it needs hours of hipcc time, which it
# would take out of the walltime of whatever job first creates the environment.
# Each wheel is valid for exactly one (torch, python, GPU arch) triple — rebuild and
# re-pin both whenever the torch override above moves.
# TEMP(vllm-wheel): a `path` source pointing at a file that does not exist makes
# `uv lock` fail outright ("Distribution not found at: file://..."), no matter which
# extras are being synced — so the placeholder has to go for a vllm-less sync.
# vllm = { path = "/scratch/project_462001516/users/khakala/wheels/REBUILD-vllm-0.32.0-rocm72-torch2.13-cp312-linux_x86_64.whl" }
flash-attn = { path = "/scratch/project_462001516/users/khakala/wheels/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl" }
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention" }
# The submodule, not upstream's `+cu130torch2.13.0` release wheel. `prime_kernels` is a
# pure-Python loader around optional compiled kernels; its setup.py skips every
# CUDAExtension when it finds no nvcc and no `torch.version.cuda`, so on ROCm this
# installs the loader alone. Every `prime_kernels.load(...)` call site is already
# guarded, and `load()` itself raises a readable RuntimeError when a kernel is absent.
prime-kernels = { path = "deps/prime-kernels" }

# Upstream's sources for deep-ep, deep-gemm, deep-select, flash-mla, mamba-ssm,
# flash_attn_3 and the two flashinfer-* packages are gone with the extras that
# referenced them. They were cu130/sm_100a wheel URLs; keeping them would leave this
# file documenting a graph that can no longer be resolved here.

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

# Environments Hub wheels carry no upload time, so the exclude-newer cooldown
# would reject every one of them. The Hub is first-party: skip the cutoff there.
[[tool.uv.index]]
name = "prime-hub"
url = "https://hub.primeintellect.ai/primeintellect/simple/"
explicit = true
exclude-newer = false

[tool.ruff.lint]
select = ["F", "I"]

# jaxtyping writes shapes as string annotations (`Int[Tensor, "batch seq"]`), which ruff reads as
# forward references and reports as syntax errors / undefined names.
[tool.ruff.lint.per-file-ignores]
"src/prime_rl/trainer/model.py" = ["F722", "F821"]
"src/prime_rl/trainer/rl/data.py" = ["F722", "F821"]
"src/prime_rl/trainer/rl/loss.py" = ["F722", "F821"]
"src/prime_rl/trainer/sft/data.py" = ["F722", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["prime_rl"]
known-third-party = ["verifiers", "renderers", "pydantic_config"]

[tool.ruff]
line-length = 120
extend-exclude = ["deps"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as gpu (deselect with '-m \"not gpu\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_rl"]

[tool.hatch.metadata]
allow-direct-references = true
