[project]
name = "prime-rl"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "beartype>=0.21.0",
    "cydifflib>=1.2.0",
    "datasets>=4.0.0",
    "jaxtyping>=0.3.2",
    "liger-kernel>=0.5.10",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "openai>=1.106.1",
    "pydantic>=1.10.13",
    "pydantic-settings>=2.10.1",
    "pylatexenc>=2.10",
    "tomli>=2.2.1",
    "torch>=2.9.0",
    "transformers>=4.56.0",
    "uvloop>=0.21.0",
    "vllm==0.12.0",
    "wandb>=0.20.1",
    "lovely-tensors>=0.1.18",
    "rich>=14.0.0",
    "tomli-w>=1.2.0",
    "textarena>=0.6.16",
    "nltk>=3.9.1",
    "math-verify>=0.8.0",
    "torchdata>=0.11.0",
    "accelerate>=1.10.1",
    "blobfile>=3.0.0",
    "reverse-text>=0.1.4",
    "torchtitan",
    "dion",
    "reverse-text",
    "verifiers>=0.1.8",
    "prime-evals>=0.1.5",
    "ring-flash-attn>=0.1.8",
    "prime>=0.5.0",
    "tenacity>=8.2.0",
    "pyzmq>=27.1.0",
    "flash-attn>=2.8.3",
    "amdsmi",
    "pip>=25.3",
    "wheel>=0.45.1",
    "setuptools>=79.0.1",
    "ninja>=1.13.0",
    "cmake>=4.2.1",
    "pybind11>=3.0.1",
    "math-env",
]

[project.scripts]
rl = "prime_rl.rl:main"
trainer = "prime_rl.trainer.rl.train:main"
orchestrator = "prime_rl.orchestrator.orchestrator:main"
inference = "prime_rl.inference.server:main"
sft = "prime_rl.trainer.sft.train:main"
eval = "prime_rl.eval.eval:main"
synthesize = "prime_rl.synthesize.synthesize:main"

# [project.optional-dependencies]
# flash-attn = [
#     "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.6.8/flash_attn-2.8.3+cu128torch2.9-cp312-cp312-linux_x86_64.whl",
# ]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.1",
]


[tool.uv]
no-build-isolation-package = ["flash-attn"]
prerelease = "allow"
override-dependencies = [
    "torch==2.9.1+rocm6.4",
    "torchvision==0.24.1+rocm6.4",
    "pytorch-triton-rocm==3.5.1+rocm6.4",  # This skips the dependency
    # "flash-attn==2.7.0"  # Use a stable version that doesn't have git parsing issues
]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
pytorch-triton-rocm = { url = "https://download.pytorch.org/whl/pytorch_triton_rocm-3.5.1-cp312-cp312-linux_x86_64.whl" }
reverse-text = { index = "primeintellect" }
math-env = { index = "primeintellect" }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "eb3bae36c93b2f574e13a39da2908609d4ec4b2f" }
dion = { git = "https://github.com/samsja/dion.git", rev = "main" }
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "a1fdd7e" }
vllm = { path = "/shared_silo/scratch/kahakala/lib/wheels/vllm-0.12.0+rocm641-cp312-cp312-linux_x86_64.whl" }
amdsmi = { path = "/shared_silo/scratch/kahakala/lib/prime-rl/amd_smi" }
# flash-attn = { git = "https://github.com/Dao-AILab/flash-attention.git", rev = "v2.8.3" }

# [tool.uv.extra-build-dependencies]
# flash-attn = [{ requirement = "torch", match-runtime = true }]

# [tool.uv.extra-build-variables]
# flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[[tool.uv.index]]
name = "primeintellect"
url = "https://hub.primeintellect.ai/primeintellect/simple/"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F722", "F821"] # Need to ignore for jaxtyping (https://docs.kidger.site/jaxtyping/faq/)

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as gpu (deselect with '-m \"not gpu\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
