# Policy: Qwen3.5-4B SFT (poro3 decontam mathenfi nemv2 fireasondecon500k agv1 32k, iter 24987)
# Reward:
#   dolci-ifeval-env       — IFEval constraint satisfaction, English
#   dolci-ifeval-env-fi    — IFEval constraint satisfaction, Finnish (translated dataset)
#   rubric-judge-env       — Qwen3.8-27B LLM-as-judge, English (original dataset)
#   rubric-judge-env-fi    — Qwen3.8-27B LLM-as-judge, Finnish (translated dataset)
# Algorithm: GRPO via prime-rl (IPO loss)
# Hyperparameters: batch_size=512, lr=1e-6, kl_tau=0, dppo masking, pre_batch_filters
# taken from kahakala judgeonly-poro3-qwen35-4b-sft-32k-bs512-r8-prefilter-temp1.0
#
# GPU layout (single node, 8 GPUs total):
#   GPU 0-3: trainer (FSDP)
#   GPU 4-5: vLLM inference (policy rollouts, dp=2)
#   GPU 6-7: vLLM judge/RM inference (Qwen3.8-27B, dp=2)
#
# Launch: sbatch --gpus-per-node=8 configs/basic/dolci/run.sbatch <this_config>

max_steps = 2000
seq_len = 32768
output_dir = "outputs/dolci-qwen35-4b-sft-poro3-think-qwen38-27b-fi-ifeval-bs512-8gpu-02lg"

[wandb]
project = "primerl_09"
name = "qwen35-4b-sft-poro3-think-qwen38-27b-fi-ifeval-bs512-8gpu-02lg"

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 50

[model]
name = "/shared_silo/scratch/elaizosa/output/qwen3_5_4B_sft_decontam_mathenfi_nemv2_fireasondecon500k_agv1_32k/poro3_qwen3_5_4B_sft_decontam_mathenfi_nemv2_fireasondecon500k_agv1_32k_iter24987_hf"

[trainer.optim]
lr = 1e-6
max_norm = 1.0

[trainer.scheduler]
type = "constant"

[trainer.loss]
kl_tau = 0
dppo_mask_low = 0.2
dppo_mask_high = 0.2
adv_tau = 2.0

[trainer.model]
impl = "custom"
attn = "flash_attention_2"
optim_cpu_offload = false
compile = "None"

[trainer.model.ac]
freq = 1

[orchestrator]
batch_size = 512
rollouts_per_example = 8
max_off_policy_steps = 1

[orchestrator.renderer]
name = "qwen3.5"

[orchestrator.train.sampling]
max_completion_tokens = 32768
temperature = 1.0
extra_body = { chat_template_kwargs = { enable_thinking = true }, thinking_token_budget = 30000 }

[[orchestrator.train.env]]
id = "dolci-ifeval-env"
name = "dolci_ifeval"
ratio = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", language_reward_weight = 0.0 }

[[orchestrator.train.env]]
id = "dolci-ifeval-env-fi"
name = "dolci_ifeval_fi"
ratio = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi.jsonl", language_reward_weight = 0.2 }

[[orchestrator.train.env]]
id = "rubric-judge-env"
name = "rubric_judge"
ratio = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", categories = ["general-quality_ref", "general-quality"], custom_rm = true, judge_model_path = "/shared_silo/scratch/models/Qwen3.8-27B", max_judge_tokens = 64, language_reward_weight = 0.0 }

[[orchestrator.train.env]]
id = "rubric-judge-env"
name = "rubric_judge_fi"
ratio = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi.jsonl", categories = ["general-quality_ref", "general-quality"], custom_rm = true, judge_model_path = "/shared_silo/scratch/models/Qwen3.8-27B", max_judge_tokens = 64, use_finnish = true, language_reward_weight = 0.2 }

[[orchestrator.pre_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "repetition"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
enforce = true

[trainer]
matmul_precision = "highest"

[trainer.tokenizer]
name = "/shared_silo/scratch/elaizosa/output/qwen3_5_4B_sft_decontam_mathenfi_nemv2_fireasondecon500k_agv1_32k/poro3_qwen3_5_4B_sft_decontam_mathenfi_nemv2_fireasondecon500k_agv1_32k_iter24987_hf"

[ckpt]
interval = 200
keep_last = 9999

[weight_broadcast]
type = "filesystem"

[deployment]
num_train_gpus = 4
num_infer_gpus = 2
num_rm_gpus = 2

[inference]
vllm_extra = { max_model_len = 32768 }

[inference.model]
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_coder"

[inference.parallel]
tp = 1
dp = 2

[rm_inference]
vllm_extra = { max_model_len = 32768 }

[rm_inference.parallel]
tp = 1
dp = 2
