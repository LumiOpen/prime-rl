trainer_gpu_ids = [0,1,2,3,4,5,6,7]
max_steps = 500
seq_len = 4096

[wandb]
project = "prime-rl-wordle"

[ckpt]
interval = 10
keep_last = 10

[model]
name = "PrimeIntellect/Qwen3-1.7B-Wordle-SFT"

[orchestrator]
batch_size = 256
rollouts_per_example = 16

[[orchestrator.env]]
id = "primeintellect/wordle"
name = "wordle"

[orchestrator.env.args]
system_prompt = """You are a competitive game player. Make sure you read the game instructions carefully, and always follow the required format.

In each turn, think step-by-step inside <think>...</think> tags, then follow the instructions inside <guess>...</guess> tags."""

[orchestrator.sampling]
max_tokens = 512

[trainer]

[trainer.loss]
kl_tau = 0.01

[trainer.optim]
lr = 1e-6
max_grad_norm = 1.0
