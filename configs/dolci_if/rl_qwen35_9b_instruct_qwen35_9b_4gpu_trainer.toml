# Policy: Qwen3.5-9B (instruct) — single node, 4-GPU FSDP trainer
# Reward:
#   dolci-ifeval-env — IFEval constraint satisfaction, English
#   rubric-judge-env — Qwen3.5-9B (instruct) LLM-as-judge, English
# Algorithm: GRPO via prime-rl (IPO loss)
#
# GPU layout (single node, 6 GPUs total):
#   GPU 0:   vLLM inference (policy rollouts)
#   GPU 1-4: trainer (4-GPU FSDP)
#   GPU 5:   vLLM judge inference (Qwen3.5-9B)
#
# Benefits vs 1-GPU trainer:
#   - 4× FSDP sharding → each GPU holds 1/4 of weights/gradients/optimizer states
#   - larger batch_size (512) → lower gradient variance, better reward signal
#   - optim_cpu_offload not needed (optimizer states sharded across 4 GPUs)
#
# kl_tau = 0.1: instruct model needs KL regularisation.
# Launch: sbatch --gpus-per-node=6 configs/dolci_if/run.sbatch configs/dolci_if/rl_qwen35_9b_instruct_qwen35_9b_4gpu_trainer.toml

max_steps = 2000
seq_len = 2048
output_dir = "outputs/dolci-qwen35-9b-instruct-qwen35-9b-judge-4gpu-trainer"

[wandb]
project = "dolci-if-rlvr"
name = "qwen35-9b-instruct-qwen35-9b-judge-4gpu-trainer"

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 50

[model]
name = "/shared_silo/scratch/models/Qwen3.5-9B"

[trainer.optim]
lr = 5e-7

[trainer.loss]
kl_tau = 0.1

[orchestrator]
batch_size = 512
rollouts_per_example = 16

[orchestrator.sampling]
max_tokens = 2048
temperature = 1.0
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[orchestrator.buffer]
easy_threshold = 0.95
hard_threshold = 0.05
online_difficulty_filtering = true

[[orchestrator.eval.env]]
id = "math500"
num_examples = 30
rollouts_per_example = 4

[[orchestrator.env]]
id = "dolci-ifeval-env"
name = "dolci_ifeval"
reward_weight = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B" }

[[orchestrator.env]]
id = "rubric-judge-env"
name = "rubric_judge"
reward_weight = 2.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", categories = ["general-quality_ref", "general-quality"], custom_rm = true, judge_model_path = "/shared_silo/scratch/models/Qwen3.5-9B", max_judge_tokens = 64 }

[trainer]

[trainer.tokenizer]
name = "/shared_silo/scratch/models/Qwen3.5-9B"

[ckpt]
interval = 400

[deployment]
num_train_gpus = 4
num_infer_gpus = 1
num_rm_gpus = 1

[inference]
# Instruct model has its own chat template — no tokenizer override needed.

[rm_inference]
vllm_extra = { task = "generate", max_model_len = 8192 }
