# Dolci IF-RLVR experiment: Llama-3.1-8B trained on general-quality_ref.
# Reward model is served by a vLLM instance launched automatically by the rl entrypoint.
#
# GPU layout (single node):
#   GPU 0: vLLM inference (policy rollouts)
#   GPU 1: trainer
#   GPU 2: vLLM RM inference (reward scoring via POST /v1/score)
#
# rm_server_url is injected automatically into rubric-judge-env args by the
# auto_setup_rm_inference validator — no manual server startup needed.

max_steps = 2000
seq_len = 2048
output_dir = "outputs/dolci-llama3.1-8b-mixed-split-vllm-rm"

[wandb]
project = "dolci-if-rlvr"
name = "llama3.1-8b-mixed-split-vllm-rm"

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 10

[model]
name = "/shared_silo/scratch/models/Meta-Llama-3.1-8B"

[trainer.optim]
lr = 5e-7

[trainer.loss]
# beta = 0 for base models per paper — disable KL penalty entirely
kl_tau = 0.1

[orchestrator]
batch_size = 128
rollouts_per_example = 16

[orchestrator.sampling]
max_tokens = 2048
temperature = 1.0

[orchestrator.buffer]
easy_threshold = 0.75
hard_threshold = 0.25
online_difficulty_filtering = true

[orchestrator.val]
interval = 50
num_examples = 256

[[orchestrator.env]]
id = "if-eval-env"
name = "ifeval"
reward_weight = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", min_passrate = 0.25, max_passrate = 0.75 }

[[orchestrator.env]]
id = "rubric-judge-env"
name = "rubric_judge"
reward_weight = 7.0
# rm_server_url is NOT set here — it is injected automatically from [rm_inference].
# rm_device is omitted because scoring goes over HTTP, not local GPU.
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", categories = ["general-quality_ref"], rm_model_path = "/shared_silo/scratch/models/Llama-3.1-Tulu-3-8B-RM" }

[trainer]

[trainer.tokenizer]
name = "/shared_silo/scratch/models/Meta-Llama-3.1-8B"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
num_rm_gpus = 1

[inference]
# Base model has no chat template; use Instruct tokenizer so vLLM can apply one.
vllm_extra = { tokenizer = "/shared_silo/scratch/models/Llama-3.1-8B-Instruct" }

[rm_inference]
# vLLM serves the RM with --task reward (POST /v1/score endpoint).
# model.name and server.port are auto-configured from rm_model_path and port offset.
vllm_extra = { task = "reward" }
