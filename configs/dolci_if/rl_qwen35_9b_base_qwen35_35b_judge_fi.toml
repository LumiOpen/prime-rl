# Policy: Qwen3.5-9B (base)
# Reward:
#   dolci-ifeval-env-fi — IFEval constraint satisfaction, Finnish (translated dataset)
#   rubric-judge-env-fi — Qwen3.5-35B-A3B (instruct) LLM-as-judge, Finnish (translated dataset)
# Algorithm: GRPO via prime-rl (IPO loss)
#
# GPU layout (single node):
#   GPU 0: vLLM inference (policy rollouts, Qwen3.5-9B)
#   GPU 1: trainer
#   GPU 2: vLLM judge inference (Qwen3.5-35B-A3B, POST /v1/chat/completions)
#
# kl_tau = 0.0: base model, no KL regularisation needed.
# Qwen3.5-9B base has its own chat template — no instruct tokenizer override needed.
# Qwen3.5-35B-A3B-Base has no chat template — use instruct tokenizer for judge.
# language_model_only + hf_overrides: skip VL pipeline, load as text-only MoE.

max_steps = 2000
seq_len = 2048
output_dir = "outputs/dolci-qwen35-9b-base-qwen35-35b-judge-fi"

[wandb]
project = "dolci-if-rlvr"
name = "qwen35-9b-base-qwen35-35b-judge-fi"

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 10

[model]
name = "/shared_silo/scratch/models/Qwen3.5-9B"

[trainer.optim]
lr = 5e-7

[trainer.loss]
kl_tau = 0.0

[orchestrator]
batch_size = 128
rollouts_per_example = 16

[orchestrator.sampling]
max_tokens = 2048
temperature = 1.0
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[orchestrator.buffer]
easy_threshold = 0.95
hard_threshold = 0.05
online_difficulty_filtering = true

#[[orchestrator.eval.env]]
#id = "math500"
#num_examples = 30
#rollouts_per_example = 4

[[orchestrator.env]]
id = "dolci-ifeval-env-fi"
name = "dolci_ifeval_fi"
reward_weight = 2.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi.jsonl" }

#[[orchestrator.env]]
#id = "rubric-judge-env"
#name = "rubric_judge_fi"
#reward_weight = 7.0
#args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi.jsonl", categories = ["general-quality_ref"], custom_rm = true, judge_model_path = "/shared_silo/scratch/models/Qwen3.5-35B-A3B", max_judge_tokens = 4096, use_finnish = true }

[trainer]

[trainer.tokenizer]
name = "/shared_silo/scratch/models/Qwen3.5-9B"

[ckpt]
interval = 400

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
#num_rm_gpus = 1

[inference]
# Qwen3.5-9B base has its own chat template — no tokenizer override needed.

#[rm_inference]
## Instruct model has its own chat template — no tokenizer override needed.
#vllm_extra = { max_model_len = 8192 }
