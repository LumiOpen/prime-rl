# Policy: OLMo-2-1124-7B-Instruct
# Reward:
#   if-eval-env       — IFEval + IFEvalG constraint satisfaction (ifeval category)
#   rubric-judge-env  — Qwen3.5-9B LLM-as-judge (custom_rm=True), score 1-10 normalised to [0,1]
#
# Motivation for choices:
#   - Instrucmmelnik/tmp/lighteval_resultst over base: eval showed instruct always formats output correctly (30/30 boxed)
#     while base echoes prompts and degenerates. Judge scoring requires coherent outputs.
#   - Qwen3.5-9B judge over OLMo-2-RM: scored 70% on AIME25 (21/30), has strong math &
#     reasoning understanding vs OLMo-2-RM which is a classifier trained on general preference.
#   - kl_tau = 0.1 (not 0): instruct model needs KL regularisation to retain instruction
#     following ability learned during SFT. Base paper uses 0 only for raw base models.
#   - reward_weight 1:7 preserved (IFEval:judge) matching paper's alpha=7 mixing ratio.
#
# GPU layout (single node):
#   GPU 0: vLLM inference (policy rollouts, OLMo-2 Instruct)
#   GPU 1: trainer
#   GPU 2: vLLM judge inference (Qwen3.5-9B, POST /v1/chat/completions)

max_steps = 2000
seq_len = 2048
output_dir = "outputs/dolci-olmo2-7b-instruct-qwen35-judge"

[wandb]
project = "dolci-if-rlvr"
name = "olmo2-7b-instruct-qwen35-judge"

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 10

[model]
name = "/shared_silo/scratch/models/OLMo-2-1124-7B-Instruct"

[trainer.optim]
lr = 5e-7

[trainer.loss]
# kl_tau = 0.1 for instruct models — retains SFT instruction-following.
# (base paper uses 0.0 only for raw base models like OLMo-2-7B-base)
kl_tau = 0.1

[orchestrator]
batch_size = 128
rollouts_per_example = 16

[orchestrator.sampling]
max_tokens = 2048
temperature = 1.0

[orchestrator.buffer]
easy_threshold = 0.95
hard_threshold = 0.05
online_difficulty_filtering = true

[orchestrator.val]
interval = 50
num_examples = 256

[[orchestrator.env]]
id = "if-eval-env"
name = "ifeval"
reward_weight = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", min_passrate = 0.05, max_passrate = 0.95 }

[[orchestrator.env]]
id = "rubric-judge-env"
name = "rubric_judge"
reward_weight = 7.0
# custom_rm=true → LLM-as-judge via Qwen3.5-9B (generative, not classifier).
# rm_server_url is injected automatically from [rm_inference].
# judge_model_path must match --served-model-name on the vLLM judge server.
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", categories = ["general-quality_ref"], custom_rm = true, judge_model_path = "/shared_silo/scratch/models/Qwen3.5-9B", max_judge_tokens = 4096 }

[trainer]

[trainer.tokenizer]
name = "/shared_silo/scratch/models/OLMo-2-1124-7B-Instruct"

[ckpt]
interval = 400

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
num_rm_gpus = 1

[inference]
# OLMo-2 Instruct has its own chat template — no tokenizer override needed.

[rm_inference]
# Qwen3.5-9B is a generative model — use "generate" task (POST /v1/chat/completions).
# Not "reward" (POST /pooling) which is for classifier RMs like OLMo-2-7B-RM.
# max_model_len capped at 8192: judge inputs (prompt+answer) rarely exceed 4k tokens,
# and 4096 judge output tokens fit comfortably. Avoids KV cache OOM that caused
# "Server disconnected" errors when serving with default 40k context.
vllm_extra = { task = "generate", max_model_len = 8192 }
