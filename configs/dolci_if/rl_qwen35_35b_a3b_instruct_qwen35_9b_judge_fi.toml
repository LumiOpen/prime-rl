# Policy: Qwen3.5-35B-A3B (instruct, MoE: 35B total / ~3B active, 256 experts, top-8)
# Reward:
#   dolci-ifeval-env-fi — IFEval constraint satisfaction, Finnish (translated dataset)
#   rubric-judge-env-fi — Qwen3.5-9B (instruct) LLM-as-judge, Finnish (translated dataset)
# Algorithm: GRPO via prime-rl (IPO loss)
#
# GPU layout (single node, 6 GPUs):
#   GPU 0: vLLM inference (policy rollouts) — 67GB weights, fits on 1×256GB
#   GPU 1-4: trainer (FSDP across 4 GPUs)
#   GPU 5: vLLM judge inference (Qwen3.5-9B instruct)
#
# kl_tau = 0.1: instruct model needs KL regularisation to retain SFT instruction following.
# Instruct model has its own chat template — no tokenizer override needed.
# enable_thinking=false: suppress thinking preamble in rollouts.

max_steps = 2000
seq_len = 2048
output_dir = "outputs/dolci-qwen35-35b-a3b-instruct-qwen35-9b-judge-fi"

[wandb]
project = "dolci-if-rlvr"
name = "qwen35-35b-a3b-instruct-qwen35-9b-judge-fi"

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 10

[model]
name = "/shared_silo/scratch/models/Qwen3.5-35B-A3B"

[trainer.optim]
lr = 5e-7

[trainer.loss]
kl_tau = 0.1

[orchestrator]
batch_size = 128
rollouts_per_example = 16

[orchestrator.sampling]
max_tokens = 2048
temperature = 1.0
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[orchestrator.buffer]
easy_threshold = 0.95
hard_threshold = 0.05
online_difficulty_filtering = true

[[orchestrator.eval.env]]
id = "math500"
num_examples = 30
rollouts_per_example = 4

[[orchestrator.env]]
id = "dolci-ifeval-env-fi"
name = "dolci_ifeval_fi"
reward_weight = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi.jsonl" }

[[orchestrator.env]]
id = "rubric-judge-env"
name = "rubric_judge_fi"
reward_weight = 3.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi/Dolci-Think-RL-7B-prompt-ground-truth-translated-fi.jsonl", categories = ["general-quality_ref"], custom_rm = true, judge_model_path = "/shared_silo/scratch/models/Qwen3.5-9B", max_judge_tokens = 4096, use_finnish = true }

[trainer]

[trainer.model]
optim_cpu_offload = true

[trainer.tokenizer]
name = "/shared_silo/scratch/models/Qwen3.5-35B-A3B"

[ckpt]
interval = 400

[deployment]
num_train_gpus = 4
num_infer_gpus = 1
num_rm_gpus = 1

[inference]
# Instruct model has its own chat template — no tokenizer override needed.

[rm_inference]
vllm_extra = { task = "generate", max_model_len = 8192 }
