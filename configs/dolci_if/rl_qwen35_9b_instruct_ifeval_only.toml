# Policy: Qwen3.5-9B (instruct)
# Reward:
#   if-eval-env      — IFEval constraint satisfaction, English (ifeval category)
#   dolci-ifeval-env — IFEval constraint satisfaction, English (dolci_ifeval_env)
# Algorithm: GRPO via prime-rl (IPO loss)
#
# GPU layout (single node, 2 GPUs):
#   GPU 0: vLLM inference (policy rollouts, Qwen3.5-9B instruct)
#   GPU 1: trainer
#
# kl_tau = 0.1: instruct model needs KL regularisation to retain SFT instruction following.
# Instruct model has its own chat template — no tokenizer override needed.
# enable_thinking=false: suppress thinking preamble in rollouts.
# No judge — IFEval is purely CPU-bound, steps are fast.

max_steps = 2000
seq_len = 2048
output_dir = "outputs/dolci-qwen35-9b-instruct-ifeval-only"

[wandb]
project = "dolci-if-rlvr"
name = "qwen35-9b-instruct-ifeval-only"

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 10

[model]
name = "/shared_silo/scratch/models/Qwen3.5-9B"

[trainer.optim]
lr = 5e-7

[trainer.loss]
kl_tau = 0.1

[orchestrator]
batch_size = 128
rollouts_per_example = 16

[orchestrator.sampling]
max_tokens = 2048
temperature = 1.0
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[orchestrator.buffer]
easy_threshold = 0.95
hard_threshold = 0.05
online_difficulty_filtering = true

[[orchestrator.eval.env]]
id = "math500"
num_examples = 30
rollouts_per_example = 4

[[orchestrator.env]]
id = "if-eval-env"
name = "ifeval"
reward_weight = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B", min_passrate = 0.05, max_passrate = 0.95 }

[[orchestrator.env]]
id = "dolci-ifeval-env"
name = "dolci_ifeval"
reward_weight = 1.0
args = { dataset_path = "/shared_silo/scratch/datasets/Dolci-Think-RL-7B" }

[trainer]

[trainer.tokenizer]
name = "/shared_silo/scratch/models/Qwen3.5-9B"

[ckpt]
interval = 400

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
num_rm_gpus = 0

[inference]
# Instruct model has its own chat template — no tokenizer override needed.
