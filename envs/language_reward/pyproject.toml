[project]
name = "language-reward"
version = "0.1.0"
description = "fastText language-consistency reward shared by the prime-rl environments"
requires-python = ">=3.12"
dependencies = [
    # Predict-only fastText build. It ships cp312 wheels (upstream `fasttext` is
    # sdist-only and would need a C++ toolchain in the container on every sync)
    # and returns plain lists, so the numpy-2 compatibility shim is unnecessary.
    "fasttext-predict>=0.9.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["language_reward"]
