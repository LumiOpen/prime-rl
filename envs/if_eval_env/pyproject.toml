[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "if-eval-env"
version = "0.1.0"
description = "Prime-RL environment for Dolci IF-RLVR (constraint-based instruction following)"
requires-python = ">=3.11"
dependencies = [
    "verifiers",
    "datasets",
    "langdetect",
    "nltk",
    "pandas",
    "pyarrow",
]

[project.entry-points."verifiers.environments"]
if-eval-env = "if_eval_env:load_environment"
